[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mirror-moon"
version = "0.4.3"
description = "镜中取月：本地 MediaPipe 动作交互魔法舞台"
requires-python = ">=3.12,<3.13"
dependencies = ["mediapipe", "opencv-contrib-python", "numpy", "PySide6", "moderngl"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyinstaller", "psutil"]

[project.scripts]
mirror-moon = "mirror_moon.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=local/pytest-tmp"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

